name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      FAMLY_REAL_CHROME_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" || brew install --cask google-chrome
      - run: node --test .agents/skills/famly-export/tests/*.test.mjs
      - run: bash -n .agents/skills/famly-export/scripts/download-media.sh
      - run: bash -n .agents/skills/famly-export/scripts/launch-famly-chrome.sh
      - run: node --check .agents/skills/famly-export/scripts/run-export.mjs
