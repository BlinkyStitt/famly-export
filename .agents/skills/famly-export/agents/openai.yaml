interface:
  display_name: "Famly Export"
  short_description: "Export Famly Home, Messages, and original media"
  default_prompt: "Use $famly-export to export the complete signed-in Famly Home feed, original media, and all active and archived Messages with a private offline viewer."
dependencies:
  tools:
    - type: "mcp"
      value: "famly-chrome"
      description: "Chrome DevTools MCP attached to the existing signed-in Chrome profile"
      transport: "stdio"
