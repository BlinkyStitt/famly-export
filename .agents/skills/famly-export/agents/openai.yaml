interface:
  display_name: "Famly Export"
  short_description: "Export Famly Home, Messages, and original media"
  default_prompt: "Run ./famly-export to capture or resume the complete Famly Home and active/archived Messages backup, preserve history, verify original media, publish transactionally, and open the authenticated filterable viewer."
dependencies:
  tools:
    - type: "mcp"
      value: "famly-chrome"
      description: "Hardened Chrome DevTools MCP attached only to the dedicated Famly Chrome profile"
      transport: "stdio"
