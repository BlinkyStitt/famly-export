interface:
  display_name: "Famly Export"
  short_description: "Export Famly Home, Messages, and original media"
  default_prompt: "Use $famly-export from the already-signed-in Famly Home tab to export the complete Home feed and all active and archived Messages, with Home images flat in photos/, Message images flat in message-images/, original media, and one all-messages index.html viewer with images as links."
dependencies:
  tools:
    - type: "mcp"
      value: "famly-chrome"
      description: "Chrome DevTools MCP attached to the existing signed-in Chrome profile"
      transport: "stdio"
